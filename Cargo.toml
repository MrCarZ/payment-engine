[package]
name = "payment-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1.26.1", default-features = false, features = ["v5"] }

[dev-dependencies]
rstest = { version = "0.27.0", default-features = false }
